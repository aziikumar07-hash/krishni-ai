<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — Krishni AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background: #f0fdf4;
            color: #111827;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -30%; right: -20%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(34,197,94,0.15), transparent 70%);
            border-radius: 50%;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -20%; left: -15%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(245,158,11,0.1), transparent 70%);
            border-radius: 50%;
        }
        .card {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            background: #fff;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
            text-align: center;
            animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            width: 72px; height: 72px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #dcfce7, #f0fdf4);
            border: 2px solid #bbf7d0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 2rem;
        }
        h1 {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 2.2rem;
            font-weight: 400;
            margin-bottom: 12px;
            color: #111827;
        }
        p {
            color: #6b7280;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 8px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #16a34a, #059669);
            color: white;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(22,163,74,0.3);
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(22,163,74,0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>Thank You!</h1>
        <p>Your interest has been submitted successfully. We'll review your details and get back to you within 48 hours.</p>
        <p style="font-size: 0.88rem; color: #9ca3af;">Our team is excited to help you farm smarter.</p>
        <a href="index.html" class="back-link">← Back to Homepage</a>
    </div>
</body>
</html>
